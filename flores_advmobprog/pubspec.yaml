name: flores_mobile
description: "Lab Activity 2 - Bulldog Exchange / National University Manila"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/
    - assets/images/products/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
